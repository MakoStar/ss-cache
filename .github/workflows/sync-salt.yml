name: Sync launcher salt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-salt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: 'source_repo'
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
        
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          
      - name: Run scripts
        working-directory: source_repo/scripts/node/launcher/salt
        run: |
          pnpm install
          node index.js
        shell: bash

      - name: Commit data
        working-directory: source_repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
  
          SOURCE_DIR="scripts/node/launcher/salt/output"
          TARGET_DIR="launcher-salt"
          VERSION_FILE="$TARGET_DIR/launcher_salt.json"
      
          if [ -d "$SOURCE_DIR" ]; then
            rsync -a --delete "$SOURCE_DIR"/ "$TARGET_DIR"/
          else
            echo "Script output directory not found!"
            exit 1
          fi
      
          if [ ! -f "$VERSION_FILE" ]; then
            echo "launcher_salt.json not found!"
            exit 1
          fi
      
          # 检查 version.json 是否有变更
          git add "$VERSION_FILE"
          if git diff --staged --quiet -- "$VERSION_FILE"; then
            echo "launcher_salt.json has not changed, skipping commit"
            git reset HEAD "$VERSION_FILE"
            exit 0
          fi
      
          # 版本有变化 -> 先提交 version.json
          git commit -m "update: launcher_salt.json"
      
          # 遍历区域并提交对应目录
          for region in $(jq -r 'keys[]' "$VERSION_FILE"); do
            # version=$(jq -r ".\"$region\"" "$VERSION_FILE")
            region_lower="${region,,}"
            REGION_DIR="$TARGET_DIR/$region"
            
            launcher_ver=$(jq -r ".\"$region\".ver" "$VERSION_FILE")
            
            if [ -d "$REGION_DIR" ]; then
              git add "$REGION_DIR/"
              if ! git diff --staged --quiet -- "$REGION_DIR/"; then
                git commit -m "chore($region_lower): $launcher_ver"
              else
                git reset HEAD "$REGION_DIR/"
                echo "No changes in $region, skipping"
              fi
            else
              echo "Directory $REGION_DIR not found, skipping"
            fi
          done
      
          # 推送所有提交
          git push
