name: Sync vendor data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-vendor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: 'source_repo'
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "coloredlogs>=15.0.1" \
            "fake-useragent>=2.2.0" \
            "requests>=2.34.2" \
            "unitypy>=1.25.0"
        shell: bash

      - name: Run scripts
        working-directory: source_repo/scripts/python/client-config-extractor
        run: |
          python ./main.py
        shell: bash

      - name: Commit data
        working-directory: source_repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE_DIR="scripts/python/client-config-extractor/output"
          TARGET_DIR="client-config"
          VERSION_FILE="$TARGET_DIR/version.json"

          if [ -d "$SOURCE_DIR" ]; then
            rsync -a "$SOURCE_DIR"/ "$TARGET_DIR"/
          else
            echo "Script output directory not found!"
            exit 1
          fi

          if [ ! -f "$VERSION_FILE" ]; then
            echo "version.json not found!"
            exit 1
          fi

          HAS_COMMITS=false

          # version.json 有变更
          if [ -n "$(git status --porcelain -- "$VERSION_FILE")" ]; then
            echo "version.json changed, committing..."
            git add "$VERSION_FILE"
            git commit -m "update: version.json"
            HAS_COMMITS=true
          else
            echo "version.json has not changed, skipping version commit"
          fi

          # 遍历各区域，该区域目录有变更就提交
          for region in $(jq -r 'keys[]' "$VERSION_FILE"); do
            version=$(jq -r ".\"$region\"" "$VERSION_FILE")
            region_lower="${region,,}"
            REGION_DIR="$TARGET_DIR/$region"

            if [ -d "$REGION_DIR" ]; then
              if [ -n "$(git status --porcelain -- "$REGION_DIR")" ]; then
                echo "Changes detected in $region, committing..."
                git add "$REGION_DIR"
                git commit -m "chore($region_lower): $version"
                HAS_COMMITS=true
              else
                echo "No changes in $region, skipping"
              fi
            else
              echo "Directory $REGION_DIR not found, skipping"
            fi
          done

          # TARGET_DIR 下还有其他变更
          if [ -n "$(git status --porcelain -- "$TARGET_DIR")" ]; then
            echo "Remaining changes detected in $TARGET_DIR, committing..."
            git add -A "$TARGET_DIR"
            git commit -m "chore: sync client-config data"
            HAS_COMMITS=true
          fi

          # 只有产生过 commit 才 push
          if [ "$HAS_COMMITS" = true ]; then
            echo "Pushing commits..."
            git push
          else
            echo "No changes to commit, nothing to push"
          fi
        shell: bash
